# @file ww4_run_config.yml
# @brief YAML template for WAVEWATCH IV (WW4) run-time configuration.
# @copyright © 2026 National Weather Service, National Oceanic and Atmospheric Administration, U.S. Federal Government.
#
# @details This file provides a template for configuring run-time settings
#          for WAVEWATCH IV. Most inputs are optional and have default
#          settings as indicated below. Mandatory inputs are also indicated.
#
#          To use this file, copy it to the root directory of the repository
#          or the directory from which the executable is run.
#
#          Note: All YAML files in the root directory of the clone are
#          automatically ignored by Git. This allows for local testing without
#          adding customized input files to the repository.

# Calendar type for the simulation.
# Options: "Standard" (default), "NoLeap", "ThreeSixtyDay"
# Note: "Standard" refers to the normal Gregorian calendar.
calendar_type: "Standard"

# Option for producing standard program output to the screen.
# Options: "yes" (default), "no"
produce_std_out: "yes"

# Option for producing a log file.
# Options: "yes" (default), "no"
produce_log_file: "yes"

# Option for a dry run (no computations).
# Options: "no" (default), "yes"
dry_run: "no"

# Option for propagation in x-direction.
# Options: "yes" (default), "no"
propagate_x: "yes"

# Option for propagation in y-direction.
# Options: "yes" (default), "no"
propagate_y: "yes"

# Option for propagation in theta-direction.
# Options: "yes" (default), "no"
propagate_theta: "yes"

# Option for propagation in k-direction.
# Options: "yes" (default), "no"
propagate_k: "yes"

# Option for processing source terms.
# Options: "yes" (default), "no"
source_terms: "yes"

# Mandatory input field options.
# Options: "none", "from_file", "from_coupling", "homogeneous", "from_grid"
# (Note: "from_grid" is only valid for bottom depth, and is its default).

# Water levels option.
water_levels: "none"

# Currents option.
currents: "none"

# Winds option.
winds: "none"

# Ice concentrations option.
ice_concentrations: "none"

# Bottom depth option.
bottom_depth: "from_grid"

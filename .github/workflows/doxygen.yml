name: Generate Doxygen Documentation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  doxygen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0

      - name: Install Doxygen and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Run Doxygen
        run: doxygen Doxyfile

      - name: Commit and Push Documentation
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f doxygen/
          if git diff --staged --quiet; then
            echo "No changes in documentation to commit."
          else
            git commit -m "Automated Doxygen documentation update"
            # Push specifically to the source branch for PRs, otherwise to the current branch
            TARGET_BRANCH=${{ github.head_ref || github.ref_name }}
            # Retry logic for push to handle transient server errors
            for i in {1..3}; do
              git push origin HEAD:$TARGET_BRANCH && break || {
                if [ $i -lt 3 ]; then
                  echo "Push failed, retrying in 10 seconds (attempt $i)..."
                  sleep 10
                else
                  echo "Push failed after 3 attempts."
                  exit 1
                fi
              }
            done
          fi

      - name: Upload Documentation Artifact
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-html
          path: doxygen/html
